####################################
#            Services              #
####################################

services:
  matomo:
    image: matomo:5.13.0-apache
    # build:
    #   dockerfile_inline: |
    #       FROM matomo@sha256:650f4f205b0b8968f430b0fc924e8b37e8ff023948c4db08ea300d154054b257
    #       RUN apt update && apt install -y iputils-ping mariadb-client galera-4 nano
    container_name: matomo
    ports:
      - 8181:80
    volumes:
      - /home/pranav/personal-website/sites/matomo/config:/var/www/html/config
    env_file:
      - .env
    networks:
      - traefik_external
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.matomo-rtr.entrypoints=https"
      - "traefik.http.routers.matomo-rtr.tls=true"
      - "traefik.http.routers.matomo-rtr.rule=Host(`matomo.$DOMAINNAME`)"
      - "traefik.http.routers.matomo-restricted-rtr.rule=Host(`matomo.$DOMAINNAME`) && PathPrefix(`/tmp/cache`)"
      ## Middlewares
      - "traefik.http.routers.matomo-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.matomo-restricted-rtr.middlewares=chain-authelia@file" # Authelia authentication

      ## HTTP Services
      - "traefik.http.routers.matomo-rtr.service=matomo-svc"
      - "traefik.http.routers.matomo-restricted-rtr.service=matomo-svc"
      - "traefik.http.services.matomo-svc.loadbalancer.server.port=80"
    

####################################
#            Networks              #
####################################

networks:
  traefik_external:
    external: true
    name: traefik_external
  default:
    driver: bridge

####################################
#            Volumes               #
####################################
