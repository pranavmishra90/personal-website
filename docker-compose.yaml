####################################
#            Networks              #
####################################

networks:
  traefik_external:
    external: true
    name: traefik_external
    #Created with docker network create --gateway 10.1.4.1 --subnet 10.1.4.0/24 traefik_external
  default:
    driver: bridge

####################################
#            Secrets               #
####################################

secrets:
  cloudflare_email:
    file: $SECRETSDIR/cloudflare_email
  cloudflare_api_key:
    file: $SECRETSDIR/cloudflare_api_key
  mysql_root_password:
    file: $SECRETSDIR/mysql_root_password
  mysql_wordpress_password:
    file: $SECRETSDIR/mysql_wordpress_password
  mariadb_root_password:
    file: $SECRETSDIR/mariadb_root_password

  cloudflare_api_token:
    file: $SECRETSDIR/cloudflare_api_token

  authelia_jwt_secret:
    file: $SECRETSDIR/authelia_jwt_secret
  authelia_session_secret:
    file: $SECRETSDIR/authelia_session_secret
  authelia_storage_mysql_password:
    file: $SECRETSDIR/authelia_storage_mysql_password
  authelia_notifier_smtp_password:
    file: $SECRETSDIR/authelia_notifier_smtp_password
  authelia_encryption_key:
    file: $SECRETSDIR/authelia_encryption_key
  authelia_duo_api_secret_key:
    file: $SECRETSDIR/authelia_duo_api_secret_key

####################################
#            Services              #
####################################


include:
  - dashboard/docker-compose.yaml
  - kutt/docker-compose.yaml
  # - notebook/docker-compose.yaml


services:
  # All services / apps go below this line

  # Traefik 3 - Reverse Proxy
  traefik:
    container_name: traefik
    image: traefik:v3.7
    restart: unless-stopped
    depends_on:
      - authelia
    dns:
      - 100.100.10.18   # Technitium DNS
      - 1.1.1.1        # fallback (Cloudflare DNS)
    dns_search:
      - lab.mishracloud.com
      - int.mishracloud.com
      - mishracloud.com
    logging:
      driver: "json-file"
      options:
        max-file: "5" # number of files or file count
        max-size: "10m" # file size
    networks:
      traefik_external:
        ipv4_address: 10.1.4.245
    security_opt:
      - no-new-privileges:true
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

      - $DOCKERDIR/traefik3/traefik3-static.yaml:/etc/traefik/traefik.yaml:ro
      - $DOCKERDIR/traefik3/rules:/rules:ro
      - $DOCKERDIR/traefik3/acme/acme.json:/acme.json:rw


      - $DOCKERDIR/traefik3/logs:/logs:rw
      - $DOCKERDIR/shared:/shared:rw
    environment:
      - CF_API_EMAIL=$CLOUDFLARE_EMAIL
      - CF_API_KEY=$CLOUDFLARE_API_KEY
      - TZ=$TZ
    labels:
      - "traefik.enable=true"
      # HTTP-to-HTTPS Redirect
      - "traefik.http.routers.http-catchall.entrypoints=http"
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # HTTP Routers
      - "traefik.http.routers.traefik-rtr.entrypoints=https"
      - "traefik.http.routers.traefik-rtr.rule=Host(`traefik.$DOMAINNAME`)"
      - "traefik.http.routers.traefik-rtr.tls=true"
      # - "traefik.http.routers.traefik-rtr.tls.certresolver=dns-cloudflare" # Comment out this line after first run of traefik to force the use of wildcard certs
      - "traefik.http.routers.traefik-rtr.tls.domains[0].main=$DOMAINNAME"
      - "traefik.http.routers.traefik-rtr.tls.domains[0].sans=*.$DOMAINNAME"

      ## Services - API
      - "traefik.http.routers.traefik-rtr.service=api@internal"

      ## Middlewares
      - "traefik.http.routers.traefik-rtr.middlewares=chain-authelia@file" #security headers


  # Authelia (Lite) - Self-Hosted Single Sign-On and Two-Factor Authentication
  authelia:
    container_name: authelia
    # Checking breaking changes before changing the image tag: https://github.com/authelia/authelia/releases
    image: authelia/authelia:4.29.4 #4.37.5
    restart: unless-stopped
    depends_on:
      - mariadb
    networks:
      - traefik_external
      - default
    # ports:
    #   - "9091:9091"
    volumes:
      - $DOCKERDIR/authelia/config:/config:rw
    environment:
      - TZ=$TZ
      - AUTHELIA_JWT_SECRET_FILE=/run/secrets/authelia_jwt_secret
      - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/authelia_session_secret
      - AUTHELIA_STORAGE_MYSQL_PASSWORD_FILE=/run/secrets/authelia_storage_mysql_password
      - AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE=/run/secrets/authelia_notifier_smtp_password
      - AUTHELIA_DUO_API_SECRET_KEY_FILE=/run/secrets/authelia_duo_api_secret_key
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/run/secrets/authelia_encryption_key
    secrets:
      - authelia_jwt_secret
      - authelia_session_secret
      - authelia_storage_mysql_password
      - authelia_notifier_smtp_password
      - authelia_encryption_key
      - authelia_duo_api_secret_key
    labels:
      - "traefik.enable=true"

      ## HTTP Routers
      - "traefik.http.routers.authelia-rtr.entrypoints=https"
      - "traefik.http.routers.authelia-rtr.rule=Host(`authelia.$DOMAINNAME`)"
      - "traefik.http.routers.authelia-rtr.tls=true"

      ## Middlewares
      # - "traefik.http.routers.authelia-rtr.middlewares=chain-authelia@file"

      ## HTTP Services
      - "traefik.http.routers.authelia-rtr.service=authelia-svc"
      - "traefik.http.services.authelia-svc.loadbalancer.server.port=9091"

  # Cloudflare DDNS - Dynamic DNS Updater - Update IP address of the VM automatically

  # cf-ddns:
